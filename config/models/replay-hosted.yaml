# Replay of the hosted pool: same model ids, prices and parameter rules as hosted.yaml, but
# responses are served from recorded real outputs (router_training/data/collections/
# hosted-2026-10-11/outputs.jsonl) with no network calls and no added latency. Used by CI
# regression gates and by gateway-overhead benchmarks. Content is real; latency is not.
# Requires ROUTEFORGE_REPLAY_RECORDINGS_PATH to point at the recordings file.
version: replay-hosted-2026-10-11
mode: replay
simulated: false
pricing:
  version: "2026-10-11"
  currency: USD
  sources:
    openai: "https://developers.openai.com/api/docs/pricing (standard tier, retrieved 2026-10-11)"
    anthropic: "Anthropic first-party API pricing (claude-api reference table cached 2026-10-06, prompts <=100K tokens)"
routing:
  premium_model: claude-sonnet-5-5
  economy_model: gpt-4.1-nano
models:
  - id: gpt-4.1-nano
    provider: replay
    family: openai
    tier: 0
    context_window: 1047576
    max_output_tokens: 32768
    input_cost_per_mtok: 0.10
    output_cost_per_mtok: 0.40
    timeout_s: 45
  - id: claude-haiku-5-5
    provider: replay
    family: anthropic
    tier: 1
    context_window: 1000000
    max_output_tokens: 64000
    input_cost_per_mtok: 0.10
    output_cost_per_mtok: 0.50
    timeout_s: 45
    # Claude 5.5 models reject non-default sampling params (HTTP 400).
    supported_params: [max_tokens, stop, response_format]
    # Thinking disabled so this tier behaves as a fast, low-cost model (allowed at effort <= high).
    provider_params:
      thinking: {type: disabled}
  - id: gpt-4.1-mini
    provider: replay
    family: openai
    tier: 2
    context_window: 1047576
    max_output_tokens: 32768
    input_cost_per_mtok: 0.40
    output_cost_per_mtok: 1.60
    timeout_s: 60
  - id: claude-sonnet-5-5
    provider: replay
    family: anthropic
    tier: 3
    context_window: 1000000
    max_output_tokens: 128000
    input_cost_per_mtok: 2.00
    output_cost_per_mtok: 10.00
    timeout_s: 90
    supported_params: [max_tokens, stop, response_format]
    # Sonnet 5.5 rejects thinking={type: disabled}; between_tools is the documented thinking-off mode.
    provider_params:
      thinking: {type: between_tools}
