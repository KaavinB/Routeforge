groups:
  - name: routeforge
    rules:
      - alert: RouteForgeHighErrorRate
        expr: |
          sum(rate(routeforge_requests_total{status="error"}[5m]))
            / clamp_min(sum(rate(routeforge_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "More than 5% of gateway requests are failing"
      - alert: RouteForgeCircuitOpen
        expr: max by (model) (routeforge_circuit_breaker_state) == 2
        for: 2m
        labels: {severity: warn}
        annotations:
          summary: "Circuit breaker open for {{ $labels.model }}"
      - alert: RouteForgeP95LatencyHigh
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(routeforge_request_duration_seconds_bucket[5m]))) > 10
        for: 10m
        labels: {severity: warn}
        annotations:
          summary: "Gateway p95 latency above 10s"
      - alert: RouteForgeRetryBudgetExhausted
        expr: increase(routeforge_retry_budget_exhausted_total[10m]) > 0
        labels: {severity: info}
        annotations:
          summary: "Retries are being shed by the retry budget (possible provider incident)"
